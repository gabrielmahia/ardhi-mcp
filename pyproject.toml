[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ardhi-mcp"
version = "0.1.10"
description = "MCP server for Kenya land administration — title search, land rates, subdivision process, land disputes, and National Land Commission guidance. 5 tools."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["fastmcp>=2.0.0", "pydantic>=2.0"]
keywords = ["mcp","kenya","africa","east-africa","coordination-infrastructure"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
license-files = ["LICENSE"]

[project.scripts]
ardhi-mcp = "ardhi_mcp.server:mcp.run"

[project.urls]
Issues = "https://github.com/gabrielmahia/ardhi-mcp/issues"
Homepage = "https://github.com/gabrielmahia/ardhi-mcp"
Documentation = "https://github.com/gabrielmahia/nairobi-stack"
"MCP Registry" = "https://registry.modelcontextprotocol.io"
Datasets = "https://huggingface.co/gmahia"
Evaluation = "https://github.com/gabrielmahia/kipimo"
[tool.setuptools.packages.find]
where = ["src"]
